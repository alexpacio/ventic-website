    <circle cx="128" cy="116" r="2.2"/><circle cx="140" cy="116" r="2.2"/><circle cx="152" cy="116" r="2.2"/><circle cx="164" cy="116" r="2.2"/><circle cx="176" cy="116" r="2.2"/><circle cx="188" cy="116" r="2.2"/><circle cx="200" cy="116" r="2.2"/>
