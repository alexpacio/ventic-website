    <path d="M0 8H3.17L6.5 16.37L9.83 8H13L6.5 24.35Z"/>
    <!-- E -->
    <path d="M15.4 8H26V10.65H18.1V14.75H25V17.25H18.1V21.35H26V24H15.4Z"/>
    <!-- N -->
    <path d="M29.2 8H31.9L38.9 18.9V8H41.6V24H38.9L31.9 13.1V24H29.2Z"/>
    <!-- T -->
