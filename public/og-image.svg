  <!-- top accent line -->
  <rect x="48" y="48" width="56" height="4" rx="2" fill="#F5A83F"/>
  <text x="116" y="58" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="3.2" fill="rgba(242,240,235,0.72)">LLM PRIVATI · GPU DEDICATE · DATI IN UE / US</text>

  <!-- VENTIC wordmark — scaled from 77.4x18.6 to ~520 width -->
  <g transform="translate(48, 172) scale(6.72)" fill="#F2F0EB">
