    <!-- I — accent -->
    <path d="M57.7 8H60.4V24H57.7Z" fill="#F5A83F"/>
    <!-- C -->
    <path d="M75.39 11.4A6.6 8.3 0 1 0 75.39 20.6H72.21A3.85 5.75 0 1 1 72.21 11.4Z"/>
